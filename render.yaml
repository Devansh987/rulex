services:
  - type: web
    name: rulex
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 8081

  - type: web
    name: rulex-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://rulex-dq96.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
